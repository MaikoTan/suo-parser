name: publish

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string without 'v' prefix (e.g., '0.3.0')"
        required: false
        type: string

# Needed for npm OIDC trusted publishing, provenance attestation, and GitHub Releases:
# npm exchanges the GitHub OIDC token for an npm token, so no NPM_TOKEN secret
# is required (see the "trusted publishing" setup on npmjs.com).
# GitHub Release upload needs 'contents: write'.
permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build native binaries for all platforms
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ github.ref_name == 'refs/tags/v*' && github.ref_name || inputs.version || github.ref_name }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          # wasm target needed for npm package (wasm-pack)
          target: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # 'prepublishOnly' runs 'npm run build' (wasm-pack) before packing.
      - name: Publish to npm (OIDC)
        run: npm publish --provenance --access public

  release:
    name: Create GitHub Release with binaries
    runs-on: ubuntu-latest
    needs: build-binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: suo-parser-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
