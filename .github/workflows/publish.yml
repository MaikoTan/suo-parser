name: publish

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string without 'v' prefix (e.g., '0.3.0', '0.3.0-rc.1')"
        required: false
        type: string
      tag:
        description: "npm dist-tag to publish under (default: latest, or 'next' for a prerelease)"
        required: false
        type: string

# Needed for npm OIDC trusted publishing, provenance attestation, and GitHub Releases:
# npm exchanges the GitHub OIDC token for an npm token, so no NPM_TOKEN secret
# is required (see the "trusted publishing" setup on npmjs.com).
# GitHub Release upload needs 'contents: write'.
permissions:
  contents: write
  id-token: write

jobs:
  # Resolve the version once, so every job agrees on it.
  #
  # `startsWith(github.ref, 'refs/tags/v')` is the reliable tag test; an
  # equality check against 'refs/tags/v*' never matches, because `ref_name`
  # holds only the short tag name. `format` is used instead of a bare
  # `replace`, which is unreliable on GitHub-hosted runners.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          # A prerelease is anything with a hyphen after the patch number,
          # e.g. 0.3.0-rc.1. Keep it off the `latest` dist-tag so that a plain
          # `npm install suo-parser` does not resolve to a release candidate.
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
            tag="${INPUT_TAG:-next}"
          else
            is_prerelease=false
            tag="${INPUT_TAG:-latest}"
          fi

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$version tag=$tag prerelease=$is_prerelease"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}

  build-binaries:
    name: Build native binaries for all platforms
    needs: resolve-version
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [resolve-version, build-binaries]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm 11.5.1+ is required for trusted publishing (OIDC): earlier
          # versions never request an OIDC token and fail the PUT with a
          # misleading "404 ... is not in this registry". Node 22 ships npm 10,
          # so install npm 11 explicitly rather than relying on the bundled one.
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          # Fail loudly here rather than at the registry with a misleading 404.
          npm_major=$(npm --version | cut -d. -f1)
          if [ "$npm_major" -lt 11 ]; then
            echo "::error::npm $(npm --version) cannot do OIDC trusted publishing; need >= 11.5.1"
            exit 1
          fi
          echo "npm $(npm --version) is ready for trusted publishing"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          # wasm target needed for npm package (wasm-pack)
          target: wasm32-unknown-unknown

      - name: Cache wasm-pack
        id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-0.15.0

      - name: Install wasm-pack
        if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: |
          cargo install wasm-pack --locked --version 0.15.0

      # package.json is the source of truth for what npm publishes, so the tag
      # and package.json must agree. Without this check a mistyped tag would
      # publish e.g. 0.3.0 under the name v0.3.0-rc.1 and npm would reject it.
      - name: Check version consistency
        run: |
          set -euo pipefail
          expected='${{ needs.resolve-version.outputs.version }}'
          actual="$(node -p "require('./package.json').version")"
          if [ "$expected" != "$actual" ]; then
            echo "::error::package.json version ($actual) does not match the release version ($expected)."
            echo "Update package.json (and core/wasm Cargo.toml) before tagging."
            exit 1
          fi
          echo "package.json version matches: $actual"

      # 'prepublishOnly' runs 'npm run build' (wasm-pack) before packing, and
      # 'prepack' runs scripts/verify-pkg.mjs, which refuses to pack a tarball
      # that is missing the compiled wasm.
      - name: Publish to npm (OIDC)
        run: |
          npm publish --provenance --access public --tag '${{ needs.resolve-version.outputs.tag }}'

  release:
    name: Create GitHub Release with binaries
    runs-on: ubuntu-latest
    needs: [resolve-version, build-binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: suo-parser-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          # Flag release candidates as prereleases so they are not shown as
          # the current release on the repository page.
          prerelease: ${{ needs.resolve-version.outputs.is_prerelease == 'true' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
