name: Build Binaries

on:
  workflow_call:
    inputs:
      version:
        description: "Version string without 'v' prefix (e.g., '0.3.0')"
        required: true
        type: string
    outputs:
      artifacts:
        description: "JSON array of artifact names"
        value: ${{ jobs.collect.outputs.artifacts }}

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.xz
            archive_cmd: tar -cJf
            binary_name: suo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.xz
            archive_cmd: tar -cJf
            binary_name: suo
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: zip
            archive_cmd: zip
            binary_name: suo
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: zip
            archive_cmd: zip
            binary_name: suo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            archive_cmd: zip
            binary_name: suo.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: ${{ matrix.target }}

      # rustup only auto-installs the host target's linker, so cross targets
      # need their GCC. For aarch64-unknown-linux-gnu this also avoids the
      # rust-lld Cortex-A53 failure below.
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Rust's target spec unconditionally injects
      # `-Wl,--fix-cortex-a53-843419` for aarch64-unknown-linux-gnu. The
      # self-contained rust-lld rejects that flag when cross-linking from an
      # x86_64 host, so point the build at the system GCC instead.
      # Scoped to CI rather than a committed .cargo/config.toml, so that local
      # builds are unaffected on machines without the cross toolchain.
      # See https://github.com/rust-lang/rust/issues/161486
      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build binary (release)
        run: cargo build --release --bin suo --target ${{ matrix.target }}

      # Package with an absolute output path. The previous version cd'd into
      # the binary's directory and then wrote to a *relative* "../artifacts/..",
      # which resolved to target/<triple>/artifacts/ - a directory that does not
      # exist - so every zip target failed with "Could not create output file".
      - name: Package binary
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="suo-parser-${{ inputs.version }}-${{ matrix.target }}.${{ matrix.ext }}"
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          OUT="$PWD/artifacts/$ARCHIVE"

          if [ ! -f "$BIN" ]; then
            echo "::error::expected binary not found: $BIN"
            exit 1
          fi
          mkdir -p artifacts

          if [ "${{ matrix.ext }}" = "tar.xz" ]; then
            tar -cJf "$OUT" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          else
            # -j so the archive path is independent of the current directory.
            (cd "$(dirname "$BIN")" && zip -q -j "$OUT" "$(basename "$BIN")")
          fi

          echo "artifact=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: artifacts/
          retention-days: 1

    outputs:
      artifact: ${{ steps.package.outputs.artifact }}

  collect:
    name: Collect artifact names
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifact names
        id: collect
        run: |
          ARTIFACTS='['
          for dep in ${{ needs.build.outputs.artifact }}; do
            ARTIFACTS="${ARTIFACTS}\"${dep}\","
          done
          ARTIFACTS="${ARTIFACTS%,}]"
          echo "artifacts=${ARTIFACTS}" >> $GITHUB_OUTPUT
    outputs:
      artifacts: ${{ steps.collect.outputs.artifacts }}
